name: Site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  # Cancel superseded PR runs, but never a run that may be mid-publish: a
  # cancelled deploy-pages can leave the Pages deployment stuck in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  site-build:
    name: site-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Build first so the rendered smoke tests have output to assert on;
      # REQUIRE_RENDERED turns a missing dist/ into a failure, so those
      # checks cannot silently skip in CI the way they do locally.
      - run: npm run build
      - run: npm test
        env:
          REQUIRE_RENDERED: '1'
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    if: github.event_name == 'push'
    needs: site-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  verify:
    name: verify-deploy
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The build tests assert over site/dist. Properties that exist only
      # once published — base-path resolution, the redirect stubs, agreement
      # between the manifest and the artifacts generated beside it — had no
      # check at all. Publication cannot be gated, so this detects rather
      # than prevents, and fails the run loudly when it finds something.
      - run: scripts/verify-deploy.sh
