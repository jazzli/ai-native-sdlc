name: Site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site-build:
    name: site-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Build first so the rendered smoke tests have output to assert on;
      # REQUIRE_RENDERED turns a missing dist/ into a failure, so those
      # checks cannot silently skip in CI the way they do locally.
      - run: npm run build
      - run: npm test
        env:
          REQUIRE_RENDERED: '1'
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    if: github.event_name == 'push'
    needs: site-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
