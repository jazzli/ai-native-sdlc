name: Discovery
on:
  schedule:
    - cron: "30 22 * * *" # daily, 06:30 Asia/Singapore
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Rolling state for the change-detection targets: restore the most
      # recent snapshot, save a fresh one each run.
      - uses: actions/cache@v6
        with:
          path: watch/state.json
          key: discovery-state-${{ github.run_id }}
          restore-keys: discovery-state-
      - run: node watch/discover.mjs
        env:
          GH_TOKEN: ${{ github.token }}
